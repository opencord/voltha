  <source>
    @type forward
    @id input1
    @label @mainstream
    port 24224
  </source>
  <label @mainstream>
    <match *.**>
      @type copy
        <store>
          @type file
          @id output1
          path /fluentd/log/data.*.log
          symlink_path /fluentd/log/data.log
          append true
          time_slice_format %Y%m%d
          time_slice_wait 10m
          time_format %Y%m%dT%H%M%S%z
          buffer_path /fluentd/log/data.*.log
        </store>
        <store>
          @type elasticsearch
          host elasticsearch
          port 9200
          user elastic
          password changeme
          logstash_format true
          logstash_prefix fluentd
          logstash_dateformat %Y%m%d
          include_tag_key true
          type_name access_log
          tag_key @log_name
          flush_interval 1s
        </store>
    </match>
  </label>

