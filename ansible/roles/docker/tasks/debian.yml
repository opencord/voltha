- name: Ensure Old Docker Instances Absent
  apt:
    name: "{{ item }}"
    state: absent
  with_items:
    - "docker"
    - "docker-engine"
    - "docker.io"
  tags: [docker]

- name: Ensure Docker Offical GPG Key
  become: yes
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
    validate_certs: no
  tags: [docker]

- name: Debian add Docker repository and update apt cache
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
    update_cache: yes
    state: present
  tags: [docker]

- name: Debian Docker is present
  apt:
    name: "{{ item }}"
    state: latest
    force: yes
  with_items:
    - linux-image-extra-{{ ansible_kernel }}
    - linux-image-extra-virtual
    - apt-transport-https
    - ca-certificates
    - curl
    - software-properties-common
    - docker-ce
  tags: [docker]

- name: Debian python-pip is present
  apt: name=python-pip state=present
  tags: [docker]

- name: Debian docker-py is present
  pip:
    name: docker-py
    version: 1.6.0
    state: present
  tags: [docker]

- name: netifaces pip package is present
  pip:
    name: netifaces
    version: 0.10.4
    state: present
  tags: [docker]

- name: Debian files are present
  template:
    src: "{{ docker_cfg }}"
    dest: "{{ docker_cfg_dest }}"
  register: copy_result
  tags: [docker]

- name: Enable insecure install registry
  template:
    src: "{{ docker_daemon_json }}"
    dest: "{{ docker_daemon_json_dest }}"
  register: copy_result
  tags: [docker]

- name: Debian Daemon is reloaded
  command: systemctl daemon-reload
  when: copy_result|changed and is_systemd is defined
  tags: [docker]

- name: vagrant user is added to the docker group
  user:
    name: "{{ ansible_env['SUDO_USER'] }}"
    group: docker
  register: user_result
  tags: [docker]

- name: Debian Docker service is restarted
  service:
    name: docker
    state: restarted
  when: copy_result|changed or user_result|changed
  tags: [docker]
