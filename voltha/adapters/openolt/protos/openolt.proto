syntax = "proto3";

package openolt;

import "google/api/annotations.proto";

message Empty {}

// Admin or Oper state.
message State {
    string State = 1;		// up, down
}

// OLT device indication
message OltIndication {
    string oper_state = 1;	// Operation state - up, down
}

// Streaming indication from OLT
message Indication {
    oneof data {
        OltIndication olt_ind = 1;
    }
}

service Openolt {
    rpc SetOltAdminState(State) returns (Empty) {
        option (google.api.http) = {
          post: "/v1/SetOltAdminState"
          body: "*"
        };
    }

   // A server-side streaming RPC for Olt indications.
   rpc GetIndication(Empty) returns (stream Indication) {}
}
