syntax = "proto3";

package openolt;

import "google/api/annotations.proto";

message Empty {}

message Number {
    fixed32 val = 1;
}

// OLT (device) Indication
message OltIndication {
    string oper_state = 1;	// Operation state - up, down
}

// PON Interface Indication
message PonIfIndication {
    string if = 1;		// Interface name or identifier
    string oper_state = 2;      // Oper state - up, down
}

// NNI Interface Indication
message NniIfIndication {
    string if = 1;		// Interface name or identifier
    string oper_state = 2;      // Oper state - up, down
}

// Streaming indication from OLT
message Indication {
    oneof data {
        OltIndication olt_ind = 1;	// olt (device) indication
        PonIfIndication pon_if_ind = 2;	// pon interface indication
        NniIfIndication nni_if_ind = 3;	// nni interface indication
    }
}

service Openolt {
    // Enable (admin up) newly provisioned or disabled OLT.
    rpc Enable(Empty) returns (Empty) {
        option (google.api.http) = {
          post: "/v1/Enable"
          body: "*"
        };
    }

    // Disable (admin down) OLT.
    rpc Disable(Empty) returns (Empty) {
        option (google.api.http) = {
          post: "/v1/Disable"
          body: "*"
        };
    }

    // Number of OLT PON interfaces.
    rpc NumPonIf(Empty) returns (Number) {
        option (google.api.http) = {
          post: "/v1/GetNumPonIf"
          body: "*"
        };
    }

   // A server-side streaming RPC for Olt indications.
   rpc EnableIndication(Empty) returns (stream Indication) {}
}
