syntax = "proto3";

import "bal_model_ids.proto";
import "bal_model_types.proto";
import "bal.proto";

message BalIndications{
   BalObjId     objType = 1; //type of object for which the indications have been received
   oneof u {
         BalAccessTerminalInd access_term_ind                   = 2;  // Access Terminal
         BalFlowOperStatusChange flow_op_state                  = 3;  // Flow Operational State Change
         BalFlowInd flow_ind                                    = 4;  // Flow
         BalGroupInd group_ind                                  = 5;  // Group
         BalInterfaceOperStatusChange interface_op_state        = 6;  // Interface Operational State Change
         BalInterfaceLos interface_los                          = 7;  // OLT alarms
         BalInterfaceInd interface_ind                          = 8;  // Interface
         BalInterfaceStat interface_stats                       = 9;  // NNI statistics
         BalSubscriberTerminalOperStatusChange terminal_op_state= 10; // Subscriber Terminal Operational State Change
         BalSubscriberTerminalSubTermDisc terminal_disc         = 11; // Subscriber discovery
         BalSubscriberTerminalSubTermAlarm terminal_alarm       = 12; // Subscriber alarm
         BalSubscriberTerminalDgi terminal_dgi                  = 13; // Subscriber dgi
         BalSubscriberTerminalInd terminal_ind                  = 14; // Subscriber
         BalTmQueueInd tm_queue_Ind                             = 15; // TmQueue Ind
         BalTmSchedInd tm_sched_Ind                             = 16; // TmScheduler Ind
         BalPacketBearerChannelRx  pktData                      = 17; // packet data
         BalPacketItuOmciChannelRx balOmciResp                  = 18; // OMCI response
         BalPacketIeeeOamChannelRx balOamResp                   = 19; // PLOAM response
      }
      string device_id                                          = 20; //Deviced Id
}

service BalInd {

      //Handling of bal indications from the device
      rpc BalIndInfo(BalIndications) returns(BalErr) {}
}
