syntax = "proto3";

package voltha;

import "google/protobuf/any.proto";
import "common.proto";
import "meta.proto";

message ExplicitOnuCfg {
    // ONU Serial Number allowed
    string serial_number = 1;
    // ONU ID to be assigned
    uint32 onu_id = 2;
}

message DefaultOnuCfg {
    // When an unregistered ONU serial number is received,
    // choose the below onu id
    uint32 onu_id = 1;
}

message OnuServiceProvisioningConfigPerDevice {

    // Identifies the OLT device
    // Could be nas_id or some other.Specific to Operator
    string olt_id = 1;

    // Preconfigured ONUs.
    // If auto-registration is disabled, only ONUs with the configured
    // serial_number are allowed and assigned the onu_id configured
    // This configuration can co-exist when auto-registration is enabled.
    repeated ExplicitOnuCfg explicit_onu_cfgs = 2;

    // If an ONU with un-registered serial_num is received and
    // auto-registration is enabled, the below configuration applies.
    repeated DefaultOnuCfg default_onu_cfgs = 3;


}
message AdapterConfig {

    // Common adapter config attributes here
    LogLevel.LogLevel log_level = 1;

    // enable/disable auto-registration of ONUs
    //
    // "True" -> disable, "False" -> enable
    //
    // Since, proto3 doesnt allow setting default values, and the default
    // behaviour needed was to to allow auto_registration, NOT setting the
    // the below flag results in allowing auto_registration of ONUs.
    bool disable_auto_registration = 2;

    repeated OnuServiceProvisioningConfigPerDevice onu_prov_cfgs = 3;

    // Custom (vendor-specific) configuration attributes
    google.protobuf.Any additional_config = 64;

}

// Adapter (software plugin)
message Adapter {

    // Unique name of adapter, matching the python package name under
    // voltha/adapters.
    string id = 1 [(access) = READ_ONLY];
    string vendor = 2 [(access) = READ_ONLY];
    string version = 3 [(access) = READ_ONLY];

    repeated string logical_device_ids = 4;  // Logical devices "owned"

    // Adapter configuration
    AdapterConfig config = 16;

    // Custom descriptors and custom configuration
    google.protobuf.Any additional_description = 64 [(access) = READ_ONLY];

}

message Adapters {
    repeated Adapter items = 1;
}
