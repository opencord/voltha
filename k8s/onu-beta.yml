apiVersion: v1
kind: Service
metadata:
   name: onu-beta
   labels:
     name: onu-beta
spec:
  ports:
    - name: grpc
      port: 50071
      targetPort: 50071
  selector:
    app: onu-beta
---
apiVersion: apps/v1beta1
kind: Deployment
metadata:
  name: onu-beta
spec:
   replicas: 3
   template:
     metadata:
       labels:
         app: onu-beta
       annotations:
         cni: "weave,ponmgmt"
     spec:
       containers:
         - name: onu-beta
           image: "voltha-ponsim:latest"
           env:
             - name: POD_IP
               valueFrom:
                 fieldRef:
                   fieldPath: status.podIP
             - name: NAMESPACE
               valueFrom:
                 fieldRef:
                   fieldPath: metadata.namespace

           args:
             - "/app/ponsim"
             - "-device_type"
             - "ONU"
             - "-parent_addr"
             - "olt-beta"
             - "-parent_port"
             - "50070"
             - "-grpc_port"
             - "50071"
             - "-internal_if"
             - "eth0"
             - "-external_if"
             - "eth1"
             - "-promiscuous"

           ports:
            - containerPort: 50071
              name: grpc-port

           imagePullPolicy: Never
