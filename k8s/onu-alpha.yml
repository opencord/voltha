apiVersion: v1
kind: Service
metadata:
   name: onu-alpha
   labels:
     name: onu-alpha
spec:
  ports:
    - name: grpc
      port: 50061
      targetPort: 50061
  selector:
    app: onu-alpha
---
apiVersion: apps/v1beta1
kind: Deployment
metadata:
  name: onu-alpha
spec:
   replicas: 3
   template:
     metadata:
       labels:
         app: onu-alpha
       annotations:
         cni: "weave,ponmgmt"
     spec:
       containers:
         - name: onu-alpha
           image: "voltha-ponsim:latest"
           env:
             - name: POD_IP
               valueFrom:
                 fieldRef:
                   fieldPath: status.podIP
             - name: NAMESPACE
               valueFrom:
                 fieldRef:
                   fieldPath: metadata.namespace

           args:
             - "/app/ponsim"
             - "-device_type"
             - "ONU"
             - "-parent_addr"
             - "olt-alpha"
             - "-parent_port"
             - "50060"
             - "-grpc_port"
             - "50061"
             - "-internal_if"
             - "eth0"
             - "-external_if"
             - "eth1"
             - "-promiscuous"

           ports:
            - containerPort: 50061
              name: grpc-port

           imagePullPolicy: Never
